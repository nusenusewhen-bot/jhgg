<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spammer v4.2 • Control</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --card: #151515;
            --accent: #00ffaa;
            --accent-dark: #00cc88;
            --danger: #ff3366;
            --gray: #777;
            --border: #222;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: #e0e0e0;
            font-family: system-ui, sans-serif;
            padding: 20px 12px;
            line-height: 1.4;
        }
        .container { max-width: 1520px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: var(--accent);
            text-shadow: 0 0 24px rgba(0,255,170,0.35);
            margin: 0 0 28px;
            font-size: 2.6rem;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .stat {
            background: var(--card);
            padding: 14px 24px;
            border-radius: 10px;
            border: 1px solid var(--border);
            min-width: 140px;
            text-align: center;
        }
        .stat-value { color: var(--accent); font-size: 2.1rem; font-weight: 700; }
        .stat-label  { color: var(--gray); font-size: 0.85rem; margin-top: 4px; }

        .controls {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.16s;
            font-size: 0.98rem;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(0,0,0,0.45); }

        .refresh { background: #444; color: white; }
        .start-all { background: var(--accent); color: #000; }
        .stop-all  { background: var(--danger); color: white; }
        .burst-all { background: #ffaa00; color: #000; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--accent); }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .bot-name { font-size: 1.1rem; font-weight: 600; }
        .status {
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .online  { background: var(--accent); color: #000; }
        .offline { background: #444; color: #aaa; }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #eee;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.94rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,255,170,0.18);
        }
        textarea { min-height: 78px; resize: vertical; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
        .btn-group { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 12px 0; }

        .save  { background: #0066ff; color: white; }
        .start { background: var(--accent); color: #000; }
        .stop  { background: var(--danger); color: white; }
        .burst { background: #ffaa00; color: #000; }
        .send  {
            background: #9933ff;
            color: white;
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            font-size: 1.02rem;
        }

        .info {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        .spamming { color: var(--accent); font-weight: 600; }

        @media (max-width: 620px) {
            .row, .btn-group { grid-template-columns: 1fr; }
            .stat { min-width: 120px; padding: 12px 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ SPAMMER v4.2</h1>

    <div class="stats">
        <div class="stat"><div class="stat-value" id="total">0</div><div class="stat-label">BOTS</div></div>
        <div class="stat"><div class="stat-value" id="online">0</div><div class="stat-label">ONLINE</div></div>
        <div class="stat"><div class="stat-value" id="spamming">0</div><div class="stat-label">ACTIVE</div></div>
    </div>

    <div class="controls">
        <button class="refresh" onclick="loadBots()">↻ REFRESH</button>
        <button class="start-all" onclick="startAll()">▶ START ALL</button>
        <button class="stop-all" onclick="stopAll()">■ STOP ALL</button>
        <button class="burst-all" onclick="burstAll()">⚡ BURST ALL</button>
    </div>

    <div id="botsGrid" class="grid"></div>
</div>

<script>
let bots = [];
let refreshInterval = null;

async function loadBots(silent = false) {
    try {
        const res = await fetch('/api/bots');
        const newBots = await res.json();

        // Only update if data actually changed (reduces unnecessary renders)
        if (JSON.stringify(newBots) !== JSON.stringify(bots)) {
            bots = newBots;
            updateStats();
            renderSmart();
        }
    } catch (err) {
        if (!silent) console.error('Load error:', err);
    }
}

function updateStats() {
    document.getElementById('total').textContent   = bots.length;
    document.getElementById('online').textContent  = bots.filter(b => b.connected).length;
    document.getElementById('spamming').textContent = bots.filter(b => b.config?.spamming).length;
}

function renderSmart() {
    const container = document.getElementById('botsGrid');
    const existing = new Map();
    Array.from(container.children).forEach(el => {
        const id = el.dataset.botId;
        if (id) existing.set(Number(id), el);
    });

    const oldFocus = document.activeElement;
    let focusedBotId = null;
    let focusedClass = null;
    let cursorPos = 0;

    if (oldFocus && oldFocus.closest('.card')) {
        const card = oldFocus.closest('.card');
        focusedBotId = Number(card.dataset.botId);
        focusedClass = oldFocus.className;
        cursorPos = oldFocus.selectionStart || 0;
    }

    bots.forEach(bot => {
        const id = bot.id;
        let card = existing.get(id);

        if (!card) {
            card = document.createElement('div');
            card.className = 'card';
            card.dataset.botId = id;
            container.appendChild(card);
        }

        card.innerHTML = `
            <div class="header">
                <span class="bot-name">Bot #${id}${bot.username ? ` — ${bot.username}` : ''}</span>
                <span class="status ${bot.connected ? 'online' : 'offline'}">
                    ${bot.connected ? 'ONLINE' : 'OFFLINE'}
                </span>
            </div>

            <div class="row">
                <input type="text" class="server-id" placeholder="Server ID" value="${bot.config?.serverId || ''}">
                <input type="text" class="channel-id" placeholder="Channel ID" value="${bot.config?.channelId || ''}">
            </div>

            <textarea class="message" placeholder="Spam message...">${bot.config?.message || ''}</textarea>

            <div class="row">
                <input type="number" class="delay" placeholder="Delay (ms)" value="${bot.config?.delay || 2500}">
                <button class="burst" onclick="toggleBurst(${id})">
                    ${bot.config?.burstMode ? '⚡ BURST ON' : 'BURST OFF'}
                </button>
            </div>

            <div class="btn-group">
                <button class="save" onclick="saveConfig(${id})">SAVE</button>
                <button class="start" onclick="start(${id})">START</button>
                <button class="stop" onclick="stop(${id})">STOP</button>
            </div>

            <button class="send" onclick="sendOnce(${id})">SEND NOW</button>

            <div class="info">
                <span>Queue: ${bot.queueSize || 0}</span>
                <span class="${bot.config?.spamming ? 'spamming' : ''}">
                    ${bot.config?.spamming ? 'SPAMMING' : 'IDLE'}
                </span>
            </div>
        `;

        // Restore focus if this was the active card
        if (focusedBotId === id && focusedClass) {
            const newEl = card.querySelector(`.${focusedClass}`);
            if (newEl) {
                newEl.focus();
                newEl.setSelectionRange(cursorPos, cursorPos);
            }
        }
    });

    // Clean up removed bots
    existing.forEach((card, id) => {
        if (!bots.some(b => b.id === id)) card.remove();
    });
}

function getValuesFromCard(id) {
    const card = document.querySelector(`.card[data-bot-id="${id}"]`);
    if (!card) return {};
    return {
        serverId:  card.querySelector('.server-id')?.value  || '',
        channelId: card.querySelector('.channel-id')?.value || '',
        message:   card.querySelector('.message')?.value    || '',
        delay:     parseInt(card.querySelector('.delay')?.value) || 2500
    };
}

async function saveConfig(id) {
    const data = getValuesFromCard(id);
    data.enabled = true;

    try {
        const res = await fetch(`/api/bot/${id}/configure`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (res.ok) {
            toast('Saved successfully');
            loadBots(true);
        } else {
            toast('Save failed');
        }
    } catch {
        toast('Connection error');
    }
}

async function toggleBurst(id) {
    const bot = bots.find(b => b.id === id);
    if (!bot) return;
    const next = !bot.config?.burstMode;

    await fetch(`/api/bot/${id}/configure`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ burstMode: next })
    });
    toast(`Burst ${next ? 'ON' : 'OFF'}`);
    loadBots(true);
}

async function start(id) {
    await fetch(`/api/bot/${id}/spam/start`, { method: 'POST' });
    toast('Started');
    loadBots(true);
}

async function stop(id) {
    await fetch(`/api/bot/${id}/spam/stop`, { method: 'POST' });
    toast('Stopped');
    loadBots(true);
}

async function sendOnce(id) {
    const { message, channelId } = getValuesFromCard(id);
    if (!message.trim() || !channelId.trim()) {
        return toast('Message & Channel required');
    }

    await fetch(`/api/bot/${id}/sendnow`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, channelId })
    });
    toast('Message sent');
}

async function startAll() {
    let count = 0;
    for (const b of bots) {
        if (b.config?.channelId?.trim()) {
            await start(b.id);
            count++;
        }
    }
    toast(`Started ${count} bots`);
}

async function stopAll() {
    for (const b of bots) await stop(b.id);
    toast('All stopped');
}

async function burstAll() {
    for (const b of bots) {
        await fetch(`/api/bot/${b.id}/configure`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ burstMode: true })
        });
    }
    toast('Burst enabled everywhere');
}

function toast(msg) {
    const el = document.createElement('div');
    el.textContent = msg;
    el.style.cssText = `
        position: fixed; bottom: 24px; right: 24px; background: var(--accent);
        color: #000; padding: 14px 26px; border-radius: 10px; font-weight: 600;
        z-index: 9999; box-shadow: 0 6px 22px rgba(0,0,0,0.6);
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
}

// Start
loadBots();
refreshInterval = setInterval(() => loadBots(true), 8000); // 8 seconds — comfortable typing
</script>
</body>
</html>
