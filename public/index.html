<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bot Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #00ff88; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .status { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .online { background: #00ff88; color: #000; }
        .offline { background: #ff4444; color: #fff; }
        input, textarea { width: 100%; margin: 5px 0; padding: 8px; background: #1a1a1a; border: 1px solid #555; color: #fff; border-radius: 4px; }
        textarea { height: 60px; resize: vertical; }
        .btn-group { display: flex; gap: 5px; margin-top: 10px; }
        button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .save { background: #0088ff; color: #fff; }
        .start { background: #00ff88; color: #000; }
        .stop { background: #ff4444; color: #fff; }
        .global { text-align: center; margin-bottom: 20px; }
        .global button { padding: 10px 20px; margin: 0 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Multi-Bot Spammer</h1>
        <div class="global">
            <button class="save" onclick="loadBots()">🔄 Refresh</button>
            <button class="start" onclick="startAll()">▶️ All</button>
            <button class="stop" onclick="stopAll()">⏹️ All</button>
        </div>
        <div id="bots" class="grid"></div>
    </div>

    <script>
        let bots = [];
        
        async function loadBots() {
            try {
                const res = await fetch('/api/bots');
                bots = await res.json();
                render();
            } catch (e) {
                console.error('Failed to load:', e);
            }
        }
        
        function render() {
            const div = document.getElementById('bots');
            div.innerHTML = bots.map(b => `
                <div class="card">
                    <div class="header">
                        <strong>Bot #${b.id}</strong>
                        <span class="status ${b.connected ? 'online' : 'offline'}">
                            ${b.connected ? 'ONLINE' : 'OFFLINE'}
                        </span>
                    </div>
                    <input type="text" id="srv-${b.id}" placeholder="Server ID" value="${b.config.serverId || ''}">
                    <input type="text" id="ch-${b.id}" placeholder="Channel ID" value="${b.config.channelId || ''}">
                    <textarea id="msg-${b.id}" placeholder="Message">${b.config.message || ''}</textarea>
                    <input type="number" id="del-${b.id}" placeholder="Delay (ms)" value="${b.config.delay || 5000}">
                    <div class="btn-group">
                        <button class="save" onclick="save(${b.id})">💾 SAVE</button>
                        <button class="start" onclick="start(${b.id})">▶️</button>
                        <button class="stop" onclick="stop(${b.id})">⏹️</button>
                    </div>
                    <div style="margin-top:8px;font-size:12px;color:#888">
                        Spamming: ${b.config.spamming ? 'YES' : 'NO'}
                    </div>
                </div>
            `).join('');
        }
        
        async function save(id) {
            const body = {
                serverId: document.getElementById(`srv-${id}`).value,
                channelId: document.getElementById(`ch-${id}`).value,
                message: document.getElementById(`msg-${id}`).value,
                delay: parseInt(document.getElementById(`del-${id}`).value) || 5000,
                enabled: true
            };
            
            try {
                const res = await fetch(`/api/bot/${id}/configure`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    alert('Saved! Config persists now.');
                    loadBots();
                }
            } catch (e) {
                alert('Error saving: ' + e.message);
            }
        }
        
        async function start(id) {
            await fetch(`/api/bot/${id}/spam/start`, { method: 'POST' });
            alert('Started!');
            loadBots();
        }
        
        async function stop(id) {
            await fetch(`/api/bot/${id}/spam/stop`, { method: 'POST' });
            alert('Stopped!');
            loadBots();
        }
        
        async function startAll() {
            for (const b of bots) {
                if (b.config.channelId) await fetch(`/api/bot/${b.id}/spam/start`, { method: 'POST' });
            }
            loadBots();
        }
        
        async function stopAll() {
            for (const b of bots) await fetch(`/api/bot/${b.id}/spam/stop`, { method: 'POST' });
            loadBots();
        }
        
        loadBots();
        setInterval(loadBots, 3000);
    </script>
</body>
</html>
