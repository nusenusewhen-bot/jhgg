<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Adv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { background: #0a0a0a; color: #e5e7eb; font-size: 15px; }
        .green { color: #10b981; }
        .btn-green { background: #10b981; color: #000; font-weight: 700; }
        .btn-green:hover { background: #34d399; }
        .card { background: #1f2937; border: 1px solid #374151; }
        .nav-link.active { color: #10b981; border-bottom: 3px solid #10b981; }
        .section { display: none; }
        .section.active { display: block; }
        .address-box { font-family: monospace; word-break: break-all; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div id="logout-modal" class="modal">
        <div class="card rounded-3xl p-8 max-w-sm mx-4 w-full">
            <h3 class="text-xl font-bold mb-4">Verify Logout</h3>
            <p class="text-zinc-400 text-sm mb-6">A verification code was sent to your Discord DMs. Enter it below.</p>
            <input id="logout-code" type="text" placeholder="Enter code" maxlength="6" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm text-center tracking-widest uppercase mb-4">
            <div class="flex gap-3">
                <button onclick="closeLogoutModal()" class="flex-1 bg-zinc-700 py-3 rounded-2xl text-sm">Cancel</button>
                <button onclick="verifyLogout()" class="flex-1 btn-green py-3 rounded-2xl text-sm">Verify</button>
            </div>
            <p id="logout-error" class="text-red-400 text-xs mt-3 text-center hidden"></p>
        </div>
    </div>

    <header class="bg-zinc-950 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-robot text-2xl text-emerald-500"></i>
                <h1 class="text-xl font-bold">Auto Adv</h1>
            </div>
            <div class="flex gap-4 text-sm font-medium overflow-x-auto whitespace-nowrap pb-1">
                <a href="#" onclick="switchTab(0)" class="nav-link active px-4 py-2" id="nav-0">Dashboard</a>
                <a href="#" onclick="switchTab(1)" class="nav-link px-4 py-2" id="nav-1">Purchase</a>
                <a href="#" onclick="switchTab(2)" class="nav-link px-4 py-2 hidden" id="nav-2">Configure</a>
            </div>
            <div class="flex items-center gap-3">
                <!-- Dynamic User Display - REMOVED 64zk -->
                <div id="user-display" class="flex items-center gap-2">
                    <span class="text-xs bg-zinc-900 px-3 py-1 rounded-full">Loading...</span>
                </div>
                <button onclick="initiateLogout()" class="text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-4 py-6">
        <div id="section-0" class="section active">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div class="card rounded-3xl p-6">
                    <h3 class="text-zinc-400 text-sm">Credits</h3>
                    <div id="credits-display" class="text-4xl font-bold green mt-3">$0.00</div>
                </div>
                <div class="card rounded-3xl p-6">
                    <h3 class="text-lg font-semibold mb-4">Status</h3>
                    <div id="status-box" class="p-5 bg-zinc-900 rounded-2xl text-center">
                        <p id="status-text" class="text-xl font-medium text-amber-400">Not Purchased</p>
                        <button onclick="switchTab(1)" class="mt-5 w-full btn-green py-3.5 rounded-2xl text-base">Buy Lifetime - $1.50</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-1" class="section">
            <div class="card rounded-3xl p-8 max-w-md mx-auto">
                <div class="text-center">
                    <div class="inline-block bg-emerald-600 text-black text-xs font-bold px-5 py-1 rounded-full mb-4">LIFETIME</div>
                    <h2 class="text-4xl font-bold mb-1">$1.50</h2>
                    <p class="text-zinc-400 mb-8">One-time payment - Forever access</p>
                    <button onclick="purchaseLifetime()" id="buy-btn" class="w-full btn-green py-5 rounded-2xl text-lg font-bold">Generate LTC Address</button>
                    <div id="payment-result" class="mt-8 text-left"></div>
                </div>
            </div>
        </div>

        <div id="section-2" class="section">
            <div class="card rounded-3xl p-7 max-w-lg mx-auto">
                <h2 class="text-2xl font-bold mb-8 text-center">Configure Bot</h2>
                <div class="space-y-6">
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Discord Token</label>
                        <input id="token" type="password" placeholder="Paste token here" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Channel IDs</label>
                        <input id="channels" type="text" placeholder="123456789,987654321" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Message</label>
                        <textarea id="message" rows="4" placeholder="Your ad message..." class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl px-5 py-4 text-sm"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="startBot()" class="flex-1 btn-green py-4 rounded-2xl">Start Bot</button>
                        <button onclick="stopBot()" class="flex-1 bg-red-600 py-4 rounded-2xl">Stop Bot</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isPurchased = false;
        let currentUser = null;

        function switchTab(n) {
            if (n === 2 && !isPurchased) { alert("Purchase first!"); return; }
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + n).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('nav-' + n).classList.add('active');
        }

        // Load user data - shows Discord avatar + username instead of 64zk
        async function loadUserData() {
            try {
                const res = await fetch('/api/user');
                if (!res.ok) throw new Error('Not authenticated');
                const data = await res.json();
                currentUser = data;
                
                const userDisplay = document.getElementById('user-display');
                const displayName = data.global_name || data.username;
                const avatarUrl = data.avatar 
                    ? 'https://cdn.discordapp.com/avatars/' + data.id + '/' + data.avatar + '.png?size=64'
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';
                
                // Shows avatar image + display name (no more 64zk)
                userDisplay.innerHTML = '<img src="' + avatarUrl + '" alt="avatar" class="user-avatar"><span class="text-xs bg-zinc-900 px-3 py-1 rounded-full">' + displayName + '</span>';
                
                document.getElementById('credits-display').textContent = '$' + (data.credits || 0).toFixed(2);
                
                if (data.purchased) {
                    isPurchased = true;
                    document.getElementById('status-text').textContent = 'Active';
                    document.getElementById('status-text').className = 'text-xl font-medium text-emerald-400';
                    document.getElementById('nav-2').classList.remove('hidden');
                }
            } catch (err) {
                console.error('Failed to load user:', err);
                if (err.message === 'Not authenticated') window.location.href = '/login';
            }
        }

        async function initiateLogout() {
            if (!confirm("Logout?")) return;
            try {
                const res = await fetch('/api/logout/request', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (data.success) document.getElementById('logout-modal').classList.add('active');
                else alert(data.error || 'Failed');
            } catch (err) { alert('Network error'); }
        }

        function closeLogoutModal() {
            document.getElementById('logout-modal').classList.remove('active');
            document.getElementById('logout-code').value = '';
            document.getElementById('logout-error').classList.add('hidden');
        }

        async function verifyLogout() {
            const code = document.getElementById('logout-code').value.trim();
            const errorEl = document.getElementById('logout-error');
            if (!code) { errorEl.textContent = 'Enter code'; errorEl.classList.remove('hidden'); return; }
            try {
                const res = await fetch('/api/logout/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) });
                const data = await res.json();
                if (data.success) window.location.href = '/';
                else { errorEl.textContent = data.error || 'Invalid'; errorEl.classList.remove('hidden'); }
            } catch (err) { errorEl.textContent = 'Error'; errorEl.classList.remove('hidden'); }
        }

        document.getElementById('logout-modal').addEventListener('click', (e) => { if (e.target.id === 'logout-modal') closeLogoutModal(); });
        document.getElementById('logout-code').addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyLogout(); });

        async function purchaseLifetime() {
            const btn = document.getElementById('buy-btn');
            const result = document.getElementById('payment-result');
            btn.disabled = true; btn.textContent = "Generating..."; result.innerHTML = "";
            try {
                const res = await fetch('/api/purchase/lifetime', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                if (data.success) {
                    result.innerHTML = '<div class="bg-zinc-900 p-5 rounded-2xl"><p class="text-emerald-400 text-sm mb-2">Send exactly <strong>0.000015 LTC</strong> to:</p><p class="address-box text-emerald-300 text-sm">' + data.address + '</p></div>';
                    setTimeout(() => checkPaymentStatus(), 10000);
                } else result.innerHTML = '<p class="text-red-400">' + (data.error || "Failed") + '</p>';
            } catch (err) { result.innerHTML = '<p class="text-red-400">Network error</p>'; }
            finally { btn.disabled = false; btn.textContent = "Generate LTC Address"; }
        }

        async function checkPaymentStatus() {
            try {
                const res = await fetch('/api/credits/check', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    isPurchased = true; document.getElementById('nav-2').classList.remove('hidden'); switchTab(0);
                    alert("Payment confirmed!"); loadUserData();
                } else setTimeout(() => checkPaymentStatus(), 10000);
            } catch (e) { setTimeout(() => checkPaymentStatus(), 15000); }
        }

        function startBot() { alert("Bot started!"); }
        function stopBot() { alert("Bot stopped."); }

        window.onload = () => { loadUserData(); switchTab(0); };
    </script>
</body>
</html>
