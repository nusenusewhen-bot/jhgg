<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Adv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { background: #0a0a0a; color: #e5e7eb; font-size: 15px; }
        .green { color: #10b981; }
        .btn-green { background: #10b981; color: #000; font-weight: 700; }
        .btn-green:hover { background: #34d399; }
        .btn-green:disabled { background: #065f46; cursor: not-allowed; }
        .btn-purple { background: #8b5cf6; color: #fff; font-weight: 700; }
        .card { background: #1f2937; border: 1px solid #374151; }
        .nav-link.active { color: #10b981; border-bottom: 3px solid #10b981; }
        .section { display: none; }
        .section.active { display: block; }
        .address-box { font-family: monospace; word-break: break-all; font-size: 14px; background: #0a0a0a; padding: 12px; border-radius: 8px; border: 1px solid #10b981; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .error-text { color: #ef4444; font-size: 14px; margin-top: 8px; }
        .success-text { color: #10b981; font-size: 14px; margin-top: 8px; }
        .redeem-section { border: 2px dashed #8b5cf6; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div id="logout-modal" class="modal">
        <div class="card rounded-3xl p-8 max-w-sm mx-4 w-full">
            <h3 class="text-xl font-bold mb-4">Verify Logout</h3>
            <input id="logout-code" type="text" placeholder="Enter code" maxlength="6" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm text-center tracking-widest uppercase mb-4">
            <div class="flex gap-3">
                <button onclick="closeLogoutModal()" class="flex-1 bg-zinc-700 py-3 rounded-2xl text-sm">Cancel</button>
                <button onclick="verifyLogout()" class="flex-1 btn-green py-3 rounded-2xl text-sm">Verify</button>
            </div>
        </div>
    </div>

    <header class="bg-zinc-950 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-robot text-2xl text-emerald-500"></i>
                <h1 class="text-xl font-bold">Auto Adv</h1>
            </div>
            <div class="flex gap-4 text-sm font-medium overflow-x-auto whitespace-nowrap pb-1">
                <a href="#" onclick="switchTab(0); return false;" class="nav-link active px-4 py-2" id="nav-0">Dashboard</a>
                <a href="#" onclick="switchTab(1); return false;" class="nav-link px-4 py-2" id="nav-1">Purchase</a>
                <a href="#" onclick="switchTab(2); return false;" class="nav-link px-4 py-2 hidden" id="nav-2">Configure</a>
            </div>
            <div class="flex items-center gap-3">
                <div id="user-display" class="flex items-center gap-2">
                    <span class="text-xs bg-zinc-900 px-3 py-1 rounded-full">Loading...</span>
                </div>
                <button onclick="initiateLogout()" class="text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-4 py-6">
        <div id="section-0" class="section active">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div class="card rounded-3xl p-6">
                    <h3 class="text-zinc-400 text-sm">Status</h3>
                    <div id="credits-display" class="text-4xl font-bold green mt-3">Free User</div>
                </div>
                <div class="card rounded-3xl p-6">
                    <h3 class="text-lg font-semibold mb-4">Access</h3>
                    <div id="status-box" class="p-5 bg-zinc-900 rounded-2xl text-center">
                        <p id="status-text" class="text-xl font-medium text-amber-400">Not Purchased</p>
                        <button onclick="switchTab(1)" class="mt-5 w-full btn-green py-3.5 rounded-2xl text-base">Get Access - $1.50</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-1" class="section">
            <div class="redeem-section card max-w-md mx-auto mb-6">
                <h3 class="text-lg font-bold mb-3 text-purple-400"><i class="fa-solid fa-key mr-2"></i>Redeem Key</h3>
                <div class="flex gap-2">
                    <input id="redeem-key" type="text" placeholder="Enter key" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3 text-sm uppercase">
                    <button onclick="redeemKey()" id="redeem-btn" class="btn-purple px-6 py-3 rounded-2xl text-sm font-bold">Redeem</button>
                </div>
                <div id="redeem-result" class="mt-3"></div>
            </div>

            <div class="card rounded-3xl p-8 max-w-md mx-auto">
                <div class="text-center">
                    <div class="inline-block bg-emerald-600 text-black text-xs font-bold px-5 py-1 rounded-full mb-4">LIFETIME</div>
                    <h2 class="text-4xl font-bold mb-1">$1.50</h2>
                    <p class="text-zinc-400 mb-2">One-time payment - Forever access</p>
                    <p class="text-xs text-zinc-500 mb-6">Send any amount, auto-swept 24/7</p>
                    
                    <button onclick="purchaseLifetime()" id="buy-btn" class="w-full btn-green py-5 rounded-2xl text-lg font-bold">Generate Address</button>
                    <div id="payment-result" class="mt-8 text-left"></div>
                    <div id="payment-status" class="mt-4"></div>
                </div>
            </div>
        </div>

        <div id="section-2" class="section">
            <div class="card rounded-3xl p-7 max-w-lg mx-auto">
                <h2 class="text-2xl font-bold mb-8 text-center">Configure Bot</h2>
                <div class="space-y-6">
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Discord Token <span id="token-status" class="text-zinc-600"></span></label>
                        <input id="token" type="password" placeholder="Paste token" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm" onblur="validateTokenInput()">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Channel IDs</label>
                        <input id="channels" type="text" placeholder="123,456,789" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Advertisement Message</label>
                        <textarea id="message" rows="3" placeholder="Your ad..." class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl px-5 py-4 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Auto-Reply (when someone asks price/cost/buy)</label>
                        <input id="auto-reply" type="text" placeholder="Auto-reply message..." class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-sm">
                    </div>
                    <div class="flex gap-4">
                        <button onclick="startBot()" class="flex-1 btn-green py-4 rounded-2xl">Start & Save</button>
                        <button onclick="stopBot()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-4 rounded-2xl">Stop</button>
                    </div>
                    <div id="bot-status" class="text-center text-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isPurchased = false;
        let tokenValid = false;

        function switchTab(n) {
            if (n === 2 && !isPurchased) { alert("Purchase or redeem first!"); return false; }
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + n).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('nav-' + n).classList.add('active');
            return false;
        }

        async function loadUserData() {
            try {
                const res = await fetch('/api/user', { credentials: 'same-origin' });
                if (!res.ok) { if (res.status === 401) window.location.href = '/login'; return; }
                const data = await res.json();
                
                const displayName = data.global_name || data.username;
                const avatarUrl = data.avatar ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=64` : 'https://cdn.discordapp.com/embed/avatars/0.png';
                document.getElementById('user-display').innerHTML = `<img src="${avatarUrl}" class="user-avatar"><span class="text-xs bg-zinc-900 px-3 py-1 rounded-full">${displayName}</span>`;
                
                if (data.purchased) {
                    isPurchased = true;
                    document.getElementById('credits-display').textContent = 'Active';
                    document.getElementById('status-text').textContent = 'Active';
                    document.getElementById('status-text').className = 'text-xl font-medium text-emerald-400';
                    document.getElementById('nav-2').classList.remove('hidden');
                    document.getElementById('status-box').innerHTML = '<p class="text-xl font-medium text-emerald-400">Active</p><button onclick="switchTab(2)" class="mt-4 w-full btn-green py-3 rounded-2xl text-sm">Configure</button>';
                }
            } catch (err) { console.error(err); }
        }

        async function redeemKey() {
            const key = document.getElementById('redeem-key').value.trim();
            const btn = document.getElementById('redeem-btn');
            const result = document.getElementById('redeem-result');
            
            if (!key) return;
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ key })
                });
                const data = await res.json();
                
                if (data.success) {
                    result.innerHTML = '<p class="success-text">Access granted!</p>';
                    setTimeout(() => { switchTab(0); loadUserData(); }, 1000);
                } else {
                    result.innerHTML = `<p class="error-text">${data.error}</p>`;
                }
            } catch (err) {
                result.innerHTML = '<p class="error-text">Network error</p>';
            } finally {
                btn.disabled = false;
            }
        }

        async function purchaseLifetime() {
            const btn = document.getElementById('buy-btn');
            const result = document.getElementById('payment-result');
            
            btn.disabled = true;
            btn.textContent = 'Generating...';
            
            try {
                const res = await fetch('/api/purchase/lifetime', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin'
                });
                const data = await res.json();
                
                if (data.success) {
                    result.innerHTML = `
                        <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-700">
                            <p class="text-emerald-400 text-sm mb-2">Send to:</p>
                            <p class="address-box text-emerald-300 text-sm mb-3">${data.address}</p>
                            <button onclick="copy('${data.address}')" class="w-full bg-zinc-800 py-2 rounded-lg text-xs">Copy</button>
                            <p class="text-zinc-500 text-xs mt-3">24/7 auto-sweep enabled. Funds detected instantly.</p>
                        </div>`;
                    document.getElementById('payment-status').innerHTML = '<p class="text-yellow-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Monitoring...</p>';
                    
                    setInterval(async () => {
                        const check = await fetch('/api/user', { credentials: 'same-origin' });
                        const checkData = await check.json();
                        if (checkData.purchased) {
                            document.getElementById('payment-status').innerHTML = '<p class="success-text">Payment detected! Access granted.</p>';
                            setTimeout(() => { switchTab(0); loadUserData(); }, 2000);
                        }
                    }, 5000);
                } else {
                    result.innerHTML = `<p class="error-text">${data.error}</p>`;
                }
            } catch (err) {
                result.innerHTML = '<p class="error-text">Server error</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Address';
            }
        }

        function copy(text) {
            navigator.clipboard.writeText(text).then(() => alert('Copied!'));
        }

        async function validateTokenInput() {
            const token = document.getElementById('token').value.trim();
            const status = document.getElementById('token-status');
            if (!token) return;
            
            status.textContent = ' (checking...)';
            try {
                const res = await fetch('/api/bot/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ token, channels: 'test', message: 'test', validateOnly: true })
                });
                const data = await res.json();
                tokenValid = data.valid;
                status.textContent = data.valid ? ' (valid)' : ' (invalid)';
                status.className = data.valid ? 'text-emerald-400' : 'text-red-400';
            } catch (e) {
                status.textContent = ' (error)';
            }
        }

        async function startBot() {
            const token = document.getElementById('token').value.trim();
            const channels = document.getElementById('channels').value.trim();
            const message = document.getElementById('message').value.trim();
            const autoReply = document.getElementById('auto-reply').value.trim();
            const status = document.getElementById('bot-status');
            
            if (!token || !channels || !message) {
                status.innerHTML = '<span class="text-red-400">Fill all fields</span>';
                return;
            }
            
            status.innerHTML = '<span class="text-yellow-400">Validating...</span>';
            
            try {
                const res = await fetch('/api/bot/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ token, channels, message, autoReply })
                });
                const data = await res.json();
                status.innerHTML = data.success ? '<span class="text-emerald-400">Running! Auto-login saved.</span>' : `<span class="text-red-400">${data.error}</span>`;
            } catch (err) {
                status.innerHTML = '<span class="text-red-400">Error</span>';
            }
        }

        async function stopBot() {
            const status = document.getElementById('bot-status');
            try {
                const res = await fetch('/api/bot/stop', { method: 'POST', credentials: 'same-origin' });
                const data = await res.json();
                status.innerHTML = data.success ? '<span class="text-zinc-400">Stopped</span>' : '<span class="text-red-400">Failed</span>';
            } catch (err) {
                status.innerHTML = '<span class="text-red-400">Error</span>';
            }
        }

        async function initiateLogout() {
            if (!confirm('Logout?')) return;
            try {
                const res = await fetch('/api/logout/request', { method: 'POST', credentials: 'same-origin' });
                const data = await res.json();
                if (data.success) document.getElementById('logout-modal').classList.add('active');
            } catch (err) {}
        }

        function closeLogoutModal() {
            document.getElementById('logout-modal').classList.remove('active');
        }

        async function verifyLogout() {
            const code = document.getElementById('logout-code').value.trim();
            try {
                const res = await fetch('/api/logout/verify', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (data.success) window.location.href = '/';
            } catch (err) {}
        }

        window.onload = () => { loadUserData(); };
    </script>
</body>
</html>
