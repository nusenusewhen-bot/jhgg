<!DOCTYPE html>
<html>
<head>
    <title>Add Credits - Auto Adv</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1a1a; color: #fff; min-height: 100vh; }
        .header { background: #2d2d2d; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 10px; }
        .menu { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #2d2d2d; transition: 0.3s; z-index: 1000; padding-top: 60px; }
        .menu.active { right: 0; }
        .menu a { display: block; padding: 20px; color: #fff; text-decoration: none; border-bottom: 1px solid #444; }
        .menu a:hover { background: #3d3d3d; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; }
        .container { padding: 40px; max-width: 800px; margin: 0 auto; }
        .card { background: #2d2d2d; border-radius: 10px; padding: 30px; margin-bottom: 20px; }
        .card h2 { margin-bottom: 20px; color: #00ff88; }
        .input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 5px; border: none; background: #1a1a1a; color: #fff; font-size: 16px; }
        .btn { background: #00ff88; color: #000; border: none; padding: 15px 40px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #00cc6a; }
        .btn:disabled { background: #666; cursor: not-allowed; }
        .wallet-box { background: #1a1a1a; padding: 20px; border-radius: 5px; margin: 20px 0; font-family: monospace; word-break: break-all; }
        .rate { color: #888; margin: 10px 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .overlay.active { display: block; }
        .success { color: #00ff88; }
        .error { color: #ff4444; }
        .pending { background: #ffaa00; color: #000; padding: 15px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Add Credits</h1>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>
    
    <div class="overlay" onclick="toggleMenu()"></div>
    
    <div class="menu" id="menu">
        <span class="close-btn" onclick="toggleMenu()">×</span>
        <a href="/dashboard">Dashboard</a>
        <a href="/purchase">Purchase</a>
        <a href="/credits">Add Credits</a>
        <a href="/configure">Configure</a>
        <a href="/tos">ToS</a>
        <a href="/logout">Logout</a>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Deposit LTC for Credits</h2>
            <p class="rate">Rate: 0.00001 LTC = $1.00 credit</p>
            <p>Enter amount of credits you want (1 credit = $1)</p>
            <input type="number" class="input" id="amount" placeholder="Amount (e.g. 10)" min="1" step="1">
            <button class="btn" id="depositBtn" onclick="generateDeposit()">Generate Deposit Address</button>
            <div id="depositInfo"></div>
            <div id="msg" style="margin-top:15px;"></div>
        </div>
        
        <div class="card" id="pendingSection" style="display:none;">
            <h2>Pending Deposit</h2>
            <div id="pendingStatus"></div>
            <button class="btn" onclick="checkDeposit()">Check Payment</button>
        </div>
        
        <div class="card">
            <h2>Secret Promo Code</h2>
            <input type="text" class="input" id="promoCode" placeholder="Enter promo code">
            <button class="btn" onclick="redeemPromo()">Redeem</button>
            <div id="promoMsg" style="margin-top:15px;"></div>
        </div>
    </div>
    
    <script>
        function toggleMenu() {
            document.getElementById('menu').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }
        
        async function generateDeposit() {
            const amount = document.getElementById('amount').value;
            const btn = document.getElementById('depositBtn');
            const msg = document.getElementById('msg');
            const info = document.getElementById('depositInfo');
            
            if (!amount || amount < 1) {
                msg.innerHTML = '<span class="error">Enter valid amount</span>';
                return;
            }
            
            btn.disabled = true;
            msg.innerHTML = 'Generating address...';
            
            try {
                const res = await fetch('/api/credits/deposit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({amount: parseFloat(amount)})
                });
                const data = await res.json();
                
                if (data.success) {
                    info.innerHTML = `
                        <div class="wallet-box">
                            <div style="color:#00ff88;margin-bottom:10px;">Send ${data.amount * 0.00001} LTC to:</div>
                            <div style="font-size:16px;">${data.address}</div>
                            <div style="margin-top:15px;color:#888;">You will receive: $${data.amount} credits</div>
                        </div>
                    `;
                    msg.innerHTML = '<span class="success">Address generated! Send LTC to add credits.</span>';
                    document.getElementById('pendingSection').style.display = 'block';
                    document.getElementById('pendingStatus').innerHTML = `<div class="pending">Waiting for payment to ${data.address.substring(0,20)}...</div>`;
                } else {
                    msg.innerHTML = `<span class="error">${data.error}</span>`;
                    btn.disabled = false;
                }
            } catch (err) {
                msg.innerHTML = '<span class="error">Network error</span>';
                btn.disabled = false;
            }
        }
        
        async function checkDeposit() {
            const msg = document.getElementById('msg');
            msg.innerHTML = 'Checking...';
            
            try {
                const res = await fetch('/api/credits/check', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    msg.innerHTML = `<span class="success">Payment confirmed! Added $${data.credits.toFixed(2)} credits</span>`;
                    document.getElementById('pendingSection').style.display = 'none';
                    setTimeout(() => window.location.href = '/dashboard', 2000);
                } else {
                    msg.innerHTML = `<span class="error">${data.message || 'Payment not yet received'}</span>`;
                }
            } catch (err) {
                msg.innerHTML = '<span class="error">Check failed</span>';
            }
        }
        
        async function redeemPromo() {
            const code = document.getElementById('promoCode').value;
            const msg = document.getElementById('promoMsg');
            
            try {
                const res = await fetch('/api/purchase/credits', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({amount: 0, promoCode: code})
                });
                const data = await res.json();
                
                if (data.success && data.credits > 1000) {
                    msg.innerHTML = `<span class="success">Promo redeemed! Credits: $${data.credits.toFixed(2)}</span>`;
                } else {
                    msg.innerHTML = '<span class="error">Invalid promo code</span>';
                }
            } catch (err) {
                msg.innerHTML = '<span class="error">Error</span>';
            }
        }
    </script>
</body>
</html>
